name: Build Yass Reincarnated

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release (for example v2026.7)'
        required: true
        type: string
      draft:
        description: 'Keep the GitHub release as a draft'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            arch: x64
            classifier: win
            artifact_type: nsis
          - os: ubuntu-22.04
            name: Linux
            arch: x64
            classifier: linux
            artifact_type: deb
          - os: macos-latest
            name: macOS-ARM
            arch: aarch64
            classifier: mac-aarch64
            artifact_type: dmg
          - os: macos-15-intel
            name: macOS-x64
            arch: x64
            classifier: mac
            artifact_type: dmg

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: maven
          
      - name: Verify Java Runtime
        shell: bash
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Maven ==="
          bash ./mvnw -version
      
      - name: Build with Maven
        shell: bash
        run: bash ./mvnw -B -ntp clean package -DskipTests -Djavafx.platform=${{ matrix.classifier }}

      - name: Prepare Package Input
        shell: bash
        run: |
          mkdir -p package-input
          cp target/Yass-Reincarnated.jar package-input/
          [ -d "lib" ] && cp lib/*.jar package-input/ || true

      - name: Name Linux release jar
        if: matrix.classifier == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          RELEASE_REF="$RELEASE_TAG"
          RELEASE_VERSION="${RELEASE_REF#v}"
          cp package-input/Yass-Reincarnated.jar "dist/Yass-Reincarnated-${RELEASE_VERSION}-linux-x64.jar"

      # --- WINDOWS: NSIS BUILD ---
      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y

      - name: Build Windows Installer (NSIS)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appVersion = (Get-Content target/classes/version.properties -Raw | ConvertFrom-StringData).version
          jpackage --type app-image --dest dist-img --name "yass" --main-jar Yass-Reincarnated.jar --input package-input --icon "src/yass/resources/icons/yass-multi-icon.ico" --vendor "OliBomby" --description "Yass Reincarnated - Karaoke Editor" --app-version $appVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\NSIS\makensis.exe" nsis-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item yass-reincarnated-installer.exe dist/
          
      # --- LINUX & MACOS: JPACKAGE BUILD ---
      - name: Build Linux/macOS Package
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          EXTRA_OPTS=""
          TARGET_FILE=""

          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            EXTRA_OPTS="--linux-package-deps ffmpeg,aubio-tools"
            TARGET_FILE="dist/yass-reincarnated-linux-amd64.deb"
          elif [ "${{ matrix.name }}" == "macOS-ARM" ]; then
            TARGET_FILE="dist/yass-reincarnated-macos-arm64.dmg"
          else
            TARGET_FILE="dist/yass-reincarnated-macos-x64.dmg"
          fi

          jpackage \
            --type ${{ matrix.artifact_type }} \
            --dest dist \
            --name "Yass-Reincarnated" \
            --app-version "$(sed -n 's/^version=//p' target/classes/version.properties | tr -d '\r')" \
            --main-jar Yass-Reincarnated.jar \
            --main-class yass.YassMain \
            --input package-input \
            --vendor "OliBomby" \
            $EXTRA_OPTS

          GENERATED_FILE=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.dmg' \) | head -n 1)
          mv "$GENERATED_FILE" "$TARGET_FILE"

      # --- ARTIFACT UPLOAD ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yass-Reincarnated-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.jar
            dist/*.exe

  build-linux-nix:
    name: Build Linux (Nix)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Linux package with Nix
        shell: bash
        run: |
          nix build --option sandbox false .#packages.x86_64-linux.default

      - name: Archive Nix package
        shell: bash
        run: |
          mkdir -p dist
          tar --dereference -czf dist/yass-reincarnated-linux-x86_64-nix.tar.gz result

      - name: Upload Nix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yass-Reincarnated-Linux-Nix
          if-no-files-found: error
          path: dist/yass-reincarnated-linux-x86_64-nix.tar.gz

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - build
      - build-linux-nix
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Yass-Reincarnated-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft || false }}
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/yass-reincarnated-macos-x64.dmg
            release-artifacts/yass-reincarnated-macos-arm64.dmg
            release-artifacts/yass-reincarnated-linux-amd64.deb
            release-artifacts/Yass-Reincarnated-*-linux-x64.jar
            release-artifacts/yass-reincarnated-installer.exe
            release-artifacts/yass-reincarnated-linux-x86_64-nix.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
