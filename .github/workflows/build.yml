name: Build Yass Reincarnated

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
env:
  JAVA_VERSION: "21"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            arch: x64
            classifier: win
            artifact_type: nsis
          - os: ubuntu-22.04
            name: Linux
            arch: x64
            classifier: linux
            artifact_type: deb
          - os: macos-latest
            name: macOS-ARM
            arch: aarch64
            classifier: mac-aarch64
            artifact_type: dmg
          - os: macos-latest
            name: macOS-x64
            arch: x64
            classifier: mac
            artifact_type: dmg

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: maven
          
      - name: Verify Java Runtime
        shell: bash
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Maven ==="
          mvn -version
      
      - name: Build with Maven
        shell: bash
        run: mvn clean package -DskipTests -Djavafx.platform=${{ matrix.classifier }}

      - name: Prepare Package Input
        shell: bash
        run: |
          mkdir -p package-input
          cp target/Yass-Reincarnated.jar package-input/
          [ -d "lib" ] && cp lib/*.jar package-input/ || true

      - name: Name Linux release jar
        if: matrix.classifier == 'linux' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          mkdir -p dist
          RELEASE_REF="${{ inputs.tag || github.ref_name }}"
          RELEASE_VERSION="${RELEASE_REF#v}"
          cp package-input/Yass-Reincarnated.jar "dist/Yass-Reincarnated-${RELEASE_VERSION}-linux-x64.jar"

      # --- WINDOWS: NSIS BUILD ---
      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y

      - name: Build Windows Installer (NSIS)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appVersion = (Get-Content target/classes/version.properties -Raw | ConvertFrom-StringData).version
          jpackage --type app-image --dest dist-img --name "yass" --main-jar Yass-Reincarnated.jar --input package-input --icon "src/yass/resources/icons/yass-multi-icon.ico" --vendor "OliBomby" --description "Yass Reincarnated - Karaoke Editor" --app-version $appVersion
          & "C:\Program Files (x86)\NSIS\makensis.exe" nsis-installer.nsi
          
      # --- LINUX & MACOS: JPACKAGE BUILD ---
      - name: Build Linux/macOS Package
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          EXTRA_OPTS=""
          TARGET_FILE=""

          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            EXTRA_OPTS="--linux-package-deps ffmpeg,aubio-tools"
            TARGET_FILE="dist/yass-reincarnated-linux-amd64.deb"
          elif [ "${{ matrix.name }}" == "macOS-ARM" ]; then
            TARGET_FILE="dist/yass-reincarnated-macos-arm64.dmg"
          else
            TARGET_FILE="dist/yass-reincarnated-macos-x64.dmg"
          fi

          jpackage \
            --type ${{ matrix.artifact_type }} \
            --dest dist \
            --name "Yass-Reincarnated" \
            --app-version "$(sed -n 's/^version=//p' target/classes/version.properties | tr -d '\r')" \
            --main-jar Yass-Reincarnated.jar \
            --main-class yass.YassMain \
            --input package-input \
            --vendor "OliBomby" \
            $EXTRA_OPTS

          GENERATED_FILE=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.dmg' \) | head -n 1)
          mv "$GENERATED_FILE" "$TARGET_FILE"

      # --- ARTIFACT UPLOAD ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yass-Reincarnated-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.jar
            *.exe

      # -------- RELEASE --------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/yass-reincarnated-macos-x64.dmg
            dist/yass-reincarnated-macos-arm64.dmg
            dist/yass-reincarnated-linux-amd64.deb
            dist/Yass-Reincarnated-*-linux-x64.jar
            yass-reincarnated-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-nix:
    name: Build Linux (Nix)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Linux package with Nix
        shell: bash
        run: |
          nix build --option sandbox false .#packages.x86_64-linux.default

      - name: Archive Nix package
        shell: bash
        run: |
          mkdir -p dist
          tar --dereference -czf dist/yass-reincarnated-linux-x86_64-nix.tar.gz result

      - name: Upload Nix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yass-Reincarnated-Linux-Nix
          path: dist/yass-reincarnated-linux-x86_64-nix.tar.gz

      - name: Upload Nix package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/yass-reincarnated-linux-x86_64-nix.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
